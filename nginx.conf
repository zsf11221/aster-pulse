# Aster Pulse — Nginx 配置（香港服务器用）
# 放到 /etc/nginx/sites-available/buildaster.xyz，软链到 sites-enabled。
# 注意：不要把 dist 当纯静态站用——/api/* 必须反代到 Node，否则动态接口不工作。
# HTTPS 由 Certbot 生成后自动追加到本文件（见 README 第 4 步）。

upstream aster_pulse {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name buildaster.xyz www.buildaster.xyz;

    # 让 Certbot 能验证域名
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /api/buyback 首次计算可能几十秒（7 天分段查成交），超时设 180s，别用默认 60s
    location /api/ {
        proxy_pass http://aster_pulse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # 不缓存 API：缓存逻辑在 Node 层（data/cache + TTL + stale 回退）
        proxy_cache off;
        add_header X-Cache-Backend node always;
    }

    # --- Uptime Kuma 监控状态页（feat/monitoring 新增，只加 location，不动证书相关配置）---
    # Kuma 只绑 127.0.0.1:3001，不直接暴露公网；公网只开放公开状态页。
    # 注意：Kuma 是 SPA，前端资源走绝对路径 /assets/*，实时数据走 /socket.io/，
    # 只反代 /status/ 的话页面打不开，所以下面三处要一起配，缺一不可。
    # 管理后台（/dashboard、/setup 等）不反代，只能在服务器上经 SSH 隧道访问 127.0.0.1:3001。
    # 另外：location = /assets/aster-logo.svg 是精确匹配，优先级高于下面的 /assets/ 前缀，
    # 所以 Logo 仍走 Node，不会被 Kuma 抢走；但今后不要再往 /assets/ 下加别的站内文件。
    # proxy_set_header Host $host 很关键：Kuma 会校验 WebSocket Origin 与 Host 是否一致，
    # Host 不对会报 Origin does not match host，状态页实时数据刷不出来。
    location /status/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }

    # Kuma 前端 JS/CSS（Vite 产物，绝对路径 /assets/*）
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }

    # Kuma 实时数据通道（socket.io WebSocket；超时设长，避免空闲断开反复重连）
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_cache off;
    }

    location / {
        proxy_pass http://aster_pulse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 首页 HTML 不缓存（数据靠 JS 调 /api/ 刷新）
        add_header Cache-Control "no-store" always;
    }

    # /client.js 不能缓存久：它就是前端代码本身，URL 不变、部署后浏览器还拿旧版
    # （2026-11-08 教训：max-age=3600 让旧版 JS 在用户浏览器里多留 1 小时，
    #  渲染 bug 修了也看不到）。no-cache 表示每次都向服务器确认，有新版就拿新版。
    location = /client.js {
        proxy_pass http://aster_pulse;
        add_header Cache-Control "no-cache" always;
    }
    location = /assets/aster-logo.svg {
        proxy_pass http://aster_pulse;
        add_header Cache-Control "public, max-age=86400" always;
    }

    access_log /var/log/nginx/buildaster.access.log;
    error_log /var/log/nginx/buildaster.error.log;
}
