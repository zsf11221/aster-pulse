# Aster Pulse — Nginx 配置（香港服务器用）
# 放到 /etc/nginx/sites-available/buildaster.xyz，软链到 sites-enabled。
# 注意：不要把 dist 当纯静态站用——/api/* 必须反代到 Node，否则动态接口不工作。
# HTTPS 由 Certbot 生成后自动追加到本文件（见 README 第 4 步）。

upstream aster_pulse {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name buildaster.xyz www.buildaster.xyz;

    # 让 Certbot 能验证域名
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /api/buyback 首次计算可能几十秒（7 天分段查成交），超时设 180s，别用默认 60s
    location /api/ {
        proxy_pass http://aster_pulse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # 不缓存 API：缓存逻辑在 Node 层（data/cache + TTL + stale 回退）
        proxy_cache off;
        add_header X-Cache-Backend node always;
    }

    location / {
        proxy_pass http://aster_pulse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # 首页 HTML 不缓存（数据靠 JS 调 /api/ 刷新）
        add_header Cache-Control "no-store" always;
    }

    # 静态资源可以让浏览器缓存久一点（内容在 worker.js 里，变了会换部署）
    location = /client.js {
        proxy_pass http://aster_pulse;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /assets/aster-logo.svg {
        proxy_pass http://aster_pulse;
        add_header Cache-Control "public, max-age=86400" always;
    }

    access_log /var/log/nginx/buildaster.access.log;
    error_log /var/log/nginx/buildaster.error.log;
}
